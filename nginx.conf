# This is the main Nginx configuration file
worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  # This server block handles all requests on port 80 (HTTP)
  server {
    listen 80;
    server_name arnonp.workflowsarnonp.com;

    # Redirect all HTTP traffic to HTTPS, a Discord requirement
    location / {
      return 301 https://$host$request_uri;
    }

    # This is for the Certbot (Let's Encrypt) SSL certificate renewal process
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
  }

  # This server block handles all requests on port 443 (HTTPS)
  server {
    listen 443 ssl;
    server_name arnonp.workflowsarnonp.com;

    # These are the paths to your SSL certificate files
    ssl_certificate /etc/letsencrypt/live/arnonp.workflowsarnonp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arnonp.workflowsarnonp.com/privkey.pem;

    # The location block for your proxy endpoint
    location /interactions {
      # This is the key line: proxy_pass forwards the request
      proxy_pass http://discord-n8n-proxy:8080;

      # Pass along important headers for Discord's signature validation
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      proxy_read_timeout 300s;
      proxy_connect_timeout 300s;
    }
  }
}
